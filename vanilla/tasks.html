<!-- =============================================================================
     EarnLoop — Tasks (vanilla HTML + plain CSS, no Tailwind)
     Layout & copy here; cards/filters/dialog driven by js/tasks.js from the store.
     Styles: css/theme.css · base.css · components.css · app.css · tasks.css
     ============================================================================= -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tasks | EarnLoop</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/tasks.css" />

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<main data-app-main data-active="tasks">
  <!-- Page header -->
  <div class="page-header">
    <div>
      <h1 class="page-header__title">Tasks</h1>
      <p class="page-header__desc">Complete promotional tasks across every platform to earn points.</p>
    </div>
  </div>

  <!-- Filters -->
  <div class="tasks-filters">
    <div class="input-group tasks-filters__search">
      <span class="input-group__addon"><i data-lucide="search"></i></span>
      <input id="tasks-search" class="input" type="text" placeholder="Search tasks or brands" />
    </div>
    <select id="tasks-platform" class="select" aria-label="Filter by platform"></select>
    <select id="tasks-category" class="select" aria-label="Filter by category"></select>
  </div>

  <!-- Task grid (filled by JS) -->
  <div id="tasks-grid" class="tasks-grid"></div>

  <!-- Empty state (shown when no tasks match) -->
  <div id="tasks-empty" class="empty-state" hidden>
    <span class="empty-state__ic"><i data-lucide="search"></i></span>
    <p class="empty-state__title">No tasks match your filters</p>
    <p class="empty-state__desc">Try a different platform, category, or search term.</p>
  </div>

  <!-- Task dialog (content injected by JS) -->
  <div id="task-dialog" class="dialog" aria-hidden="true">
    <div class="dialog__backdrop" data-dialog-close></div>
    <div id="task-dialog-panel" class="dialog__panel" role="dialog" aria-modal="true"></div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/tasks.js"></script>
<script src="js/shell.js"></script>
