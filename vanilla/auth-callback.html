<!-- =============================================================================
     EarnLoop — OAuth callback / router
     Supabase redirects here after Google sign-in. supabase-js reads the tokens
     from the URL, then we route:
       • first-time user (no user_metadata.onboarded) → onboarding.html
       • returning user                                → dashboard.html
       • error / no session                            → auth.html
     No visible chrome beyond a brief centered spinner.
     ============================================================================= -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signing you in… | EarnLoop</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/base.css" />

<style>
  .cb {
    min-height: 100vh;
    display: grid;
    place-items: center;
    gap: 18px;
    padding: 24px;
    font-family: var(--font-sans, Inter, system-ui, sans-serif);
    color: var(--fg, #1a1a1a);
    background: var(--bg, #fff);
    text-align: center;
  }
  .cb__spin {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid var(--border, #e5e5e5);
    border-top-color: var(--primary, #ff5a1f);
    animation: cb-spin 0.7s linear infinite;
  }
  .cb__msg { font-size: 14px; color: var(--muted-fg, #6b7280); }
  .cb__err { display: none; }
  .cb__err a { color: var(--primary, #ff5a1f); font-weight: 600; text-decoration: none; }
  @keyframes cb-spin { to { transform: rotate(360deg); } }
</style>

<div class="cb">
  <div class="cb__spin" id="cb-spin"></div>
  <p class="cb__msg" id="cb-msg">Finishing sign-in…</p>
  <p class="cb__msg cb__err" id="cb-err">
    Sign-in didn't complete. <a href="auth.html">Back to sign in</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
  (function () {
    "use strict";
    var SB = window.SB;

    function fail(message) {
      var spin = document.getElementById("cb-spin");
      var msg = document.getElementById("cb-msg");
      var err = document.getElementById("cb-err");
      if (spin) spin.style.display = "none";
      if (msg) msg.style.display = "none";
      if (err) { if (message) err.firstChild.textContent = message + " "; err.style.display = "block"; }
    }

    // Google returns an OAuth error in the query string when the user cancels
    // or the provider rejects the request.
    var q = new URLSearchParams(location.search);
    if (q.get("error")) { fail(q.get("error_description") || "Sign-in was cancelled."); return; }

    if (!SB) { fail("Auth isn't connected yet."); return; }

    // supabase-js processes the tokens in the URL hash asynchronously; wait for
    // the session to appear (a few short retries), then route by onboarding state.
    var tries = 0;
    function route() {
      SB.getSession().then(function (res) {
        var session = res && res.data ? res.data.session : null;
        if (session) {
          SB.onboardTarget().then(function (page) { location.replace(page); });
          return;
        }
        if (++tries > 25) { fail(); return; } // ~5s of 200ms polls
        setTimeout(route, 200);
      });
    }
    route();
  })();
</script>
