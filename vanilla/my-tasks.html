<!-- =============================================================================
     EarnLoop — My Tasks (vanilla HTML + plain CSS, no Tailwind)
     Layout & copy here; tabs/table driven by js/my-tasks.js from the store.
     Styles: css/theme.css · base.css · components.css · app.css · my-tasks.css
     ============================================================================= -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Tasks | EarnLoop</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/my-tasks.css" />

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<main data-app-main data-active="my-tasks">
  <!-- Page header -->
  <div class="page-header">
    <div>
      <h1 class="page-header__title">My Tasks</h1>
      <p class="page-header__desc">Track the status of every task you've submitted.</p>
    </div>
    <div class="page-header__actions">
      <a href="tasks.html" class="btn btn--primary">Find More Tasks</a>
    </div>
  </div>

  <!-- Status tabs -->
  <div class="tabs mtasks-tabs">
    <div id="mtasks-tabs" class="tabs__list" role="tablist">
      <button type="button" class="tabs__trigger is-active" data-tab="all">All</button>
      <button type="button" class="tabs__trigger" data-tab="approved">Approved</button>
      <button type="button" class="tabs__trigger" data-tab="pending">Pending</button>
      <button type="button" class="tabs__trigger" data-tab="rejected">Rejected</button>
    </div>
  </div>

  <!-- Submissions table (filled by JS) -->
  <div id="mtasks-table-wrap"></div>

  <!-- Empty state (shown when no submissions match) -->
  <div id="mtasks-empty" class="empty-state" hidden>
    <span class="empty-state__ic"><i data-lucide="clipboard-list"></i></span>
    <p class="empty-state__title">No submissions here</p>
    <p class="empty-state__desc">Complete a task to see it show up in this list.</p>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/my-tasks.js"></script>
<script src="js/shell.js"></script>
